<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp OTP Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 40px rgba(0,255,136,0.1);
        }
        h1 { text-align: center; color: #00ff88; margin-bottom: 8px; }
        p.sub { text-align: center; color: #888; margin-bottom: 24px; font-size: 14px; }
        label { display: block; margin-bottom: 6px; color: #ccc; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
        }
        input:focus { border-color: #00ff88; }
        button {
            width: 100%;
            padding: 14px;
            background: #00ff88;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #00cc6a; }
        button:disabled { opacity: 0.6; cursor: default; }
        .msg { text-align: center; margin-top: 16px; font-size: 14px; }
        .success { color: #00ff88; }
        .error { color: #ff4444; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 OTP Verify</h1>
        <p class="sub">Apna WhatsApp number daalein</p>

        <form id="sendForm">
            <label>WhatsApp Number (country code ke saath)</label>
            <input type="tel" name="phone" placeholder="919876543210" required>
            <button type="submit">OTP Bhejein</button>
        </form>

        <form id="verifyForm" class="hidden">
            <input type="hidden" name="phone" id="hiddenPhone">
            <label>OTP Daalein</label>
            <input type="text" name="otp" placeholder="123456" maxlength="6" required>
            <button type="submit">Verify Karein</button>
        </form>

        <div class="msg" id="msg"></div>
    </div>

    <script>
        const sendForm = document.getElementById('sendForm');
        const verifyForm = document.getElementById('verifyForm');
        const hiddenPhone = document.getElementById('hiddenPhone');
        const msg = document.getElementById('msg');

        function showMessage(text, isError) {
            msg.textContent = text;
            msg.className = 'msg ' + (isError ? 'error' : 'success');
        }

        function setBusy(form, busy) {
            form.querySelector('button').disabled = busy;
        }

        sendForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = sendForm.phone.value.trim();
            setBusy(sendForm, true);
            showMessage('Sending OTP...', false);

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();

                if (data.success) {
                    hiddenPhone.value = phone;
                    sendForm.classList.add('hidden');
                    verifyForm.classList.remove('hidden');
                    showMessage(data.message || 'OTP sent!', false);
                } else {
                    showMessage(data.error || 'Failed to send OTP', true);
                }
            } catch (err) {
                showMessage('Network error, try again', true);
            } finally {
                setBusy(sendForm, false);
            }
        });

        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = hiddenPhone.value;
            const otp = verifyForm.otp.value.trim();
            setBusy(verifyForm, true);

            try {
                const res = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, otp })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage('✅ Verified successfully!', false);
                    verifyForm.classList.add('hidden');
                } else {
                    showMessage('Invalid or expired OTP, try again', true);
                }
            } catch (err) {
                showMessage('Network error, try again', true);
            } finally {
                setBusy(verifyForm, false);
            }
        });
    </script>
</body>
</html>
