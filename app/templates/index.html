<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp OTP Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #0b0f19; color: #fff; padding: 20px; }
        .card { background: #161f30; padding: 25px; border-radius: 12px; max-width: 480px; margin: 20px auto; border: 1px solid #28344e; }
        h2 { color: #00ff88; margin-bottom: 15px; text-align: center; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin-top: 5px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #00ff88; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .box { padding: 12px; background: #090d16; border-radius: 6px; margin-top: 15px; font-size: 13px; word-break: break-all; }
        .status { text-align: center; padding: 8px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; }
        .online { background: #064e3b; color: #34d399; }
        .offline { background: #450a0a; color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📱 WhatsApp Setup</h2>
        <div id="statusBox" class="status offline">🔴 Status: Disconnected</div>

        <label>Apna WhatsApp Number (Country code ke sath):</label>
        <input type="text" id="botPhone" placeholder="919876543210">
        <button onclick="connectBot()">1. WhatsApp Connect Karein</button>
        <p style="font-size: 11px; color: #94a3b8; margin-top: 5px;">
            Button dabane ke baad WhatsApp par link notification aayega ya terminal me code dikhega.
        </p>
    </div>

    <div class="card">
        <h2>🚀 Test OTP Bhejein</h2>
        <label>Receiver Number:</label>
        <input type="text" id="targetPhone" placeholder="919876543210">
        <button onclick="sendOTP()">2. Send OTP</button>

        <div id="apiBox" class="box" style="display:none;">
            <b>Aapka OTP API Endpoint:</b><br>
            <code id="apiUrl"></code>
        </div>
    </div>

    <script>
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const box = document.getElementById('statusBox');
                if (data.connected) {
                    box.className = "status online";
                    box.innerText = "🟢 Status: WhatsApp Connected!";
                } else {
                    box.className = "status offline";
                    box.innerText = "🔴 Status: Disconnected";
                }
            } catch(e){}
        }
        setInterval(checkStatus, 4000);

        async function connectBot() {
            const phone = document.getElementById('botPhone').value;
            if(!phone) return alert('Number daalo!');
            alert('Connecting start ho rahi hai... Terminal check karein!');
            await fetch('/api/connect', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone})
            });
        }

        async function sendOTP() {
            const phone = document.getElementById('targetPhone').value;
            if(!phone) return alert('Receiver number daalo!');
            const res = await fetch('/api/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone})
            });
            const data = await res.json();
            if(data.success) {
                alert('OTP Bhej diya gaya!');
                document.getElementById('apiBox').style.display = "block";
                document.getElementById('apiUrl').innerText = window.location.origin + "/api/send-otp";
            } else {
                alert('Error: ' + data.error);
            }
        }
    </script>
</body>
</html>
