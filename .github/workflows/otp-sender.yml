name: WhatsApp OTP Sender

on:
  workflow_dispatch: # Manual trigger from GitHub Actions tab

jobs:
  send-otp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright browsers zaroori hain Astra ke liye
          playwright install chromium 

      # 👉 YAHAN CACHE FIX HAI (yeh session save rakhega)
      - name: Cache Astra WhatsApp Session
        uses: actions/cache@v4
        with:
          path: ~/.astra_sessions
          key: whatsapp-session-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            whatsapp-session-${{ runner.os }}-

      - name: Run WhatsApp OTP Script
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          OTP_PHONE: ${{ secrets.OTP_PHONE }}
        run: python scripts/send_otp.py
